<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TamperGuard — React</title>
  <script src="../guard/guard.js"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:#f5f5f7; color:#16161a; line-height:1.5; }
    @media (prefers-color-scheme: dark) {
      body { background:#0f0f14; color:#e8e8ea; }
      .card { background:#1a1a22 !important; border-color:#2a2a35 !important; }
      .hint { background:#15151c !important; }
      code { background:#2a2a35 !important; }
    }
    .wrap { max-width:680px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:26px; margin:0 0 4px; }
    .sub { opacity:.65; margin:0 0 28px; }
    .card { background:#fff; border:1px solid #e2e2e8; border-radius:14px; padding:22px; margin:16px 0; }
    .badge { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px;
             border-radius:999px; background:#e6f5ea; color:#137a3a; }
    .price { font-size:28px; font-weight:700; margin:10px 0 2px; }
    .hint { background:#eef0f4; border-radius:10px; padding:14px 16px; font-size:14px; }
    code { background:#e7e7ee; padding:1px 6px; border-radius:5px; font-size:13px; }
    button { margin-top:14px; padding:9px 16px; border:0; border-radius:8px;
             background:#2563eb; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // React state (NOT guarded) — proves the app keeps re-rendering freely.
      const [count, setCount] = useState(0);
      const guardedRef = useRef(null);
      const guardRef = useRef(null);

      useEffect(() => {
        // Guard only a static region React won't re-render on its own.
        const guard = new TamperGuard({ selector: '#protected' });
        guard.start();
        guardRef.current = guard;
      }, []);

      return (
        <div className="wrap">
          <h1>React demo</h1>
          <p className="sub">The protected box is static. The counter is live React state.</p>

          {/* PROTECTED static region. Edit its text in DevTools -> wall. */}
          <div className="card" id="protected" data-guard ref={guardedRef}>
            <span className="badge">Verified price</span>
            <div className="price">$1,299.00</div>
            <div>Account tier: <strong>Standard</strong></div>
          </div>

          {/* Live React state, not guarded. */}
          <div className="card">
            <div>React counter (unprotected): <strong>{count}</strong></div>
            <button onClick={() => setCount(c => c + 1)}>Increment</button>
          </div>

          <div className="hint">
            <strong>Try it:</strong> edit any text inside the protected box from
            DevTools &rarr; it locks. Meanwhile the counter keeps re-rendering with
            no false alarm.<br/><br/>
            <strong>Framework note:</strong> if React itself re-renders inside a
            guarded region it would trip the guard. So either guard static regions
            (as here), or call <code>guard.rebaseline()</code> after a legitimate
            re-render.
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
